services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
    environment:
      MODEL_PATH: /app/models/churn_model_calibrated.joblib

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
      - ./data:/app/data:ro
    environment:
      MODEL_PATH: /app/models/churn_model_calibrated.joblib
      API_URL: http://api:8000
    depends_on:
      - api

  monitoring:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitoring
    ports:
      - "8502:8502"
    volumes:
      - ./reports:/app/reports:ro
      - ./data:/app/data:ro
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
