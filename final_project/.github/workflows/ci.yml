name: BAN6800 Final Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-final.txt ]; then pip install -r requirements-final.txt; else pip install -r requirements.txt; fi

      - name: Compile Python source
        run: python -m compileall src api dashboard monitoring || true

      - name: Run unit tests
        run: pytest -q

      - name: Validate Docker Compose
        run: docker compose config
