services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >-
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      MODEL_PATH: /app/models/churn_model_calibrated.joblib
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
      - ./data:/app/data:ro
    environment:
      MODEL_PATH: /app/models/churn_model_calibrated.joblib
      API_URL: http://api:8000
      PROJECT_ROOT: /app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  monitoring:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitoring
    ports:
      - "8502:8502"
    volumes:
      - ./reports:/app/reports:ro
      - ./data:/app/data:ro
    environment:
      PROJECT_ROOT: /app
    restart: unless-stopped

  pipeline:
    profiles: ["training"]
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./mlflow:/app/mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
